name: CI

# Required gate before anything reaches main.
#
#   nix-eval      — evaluates EVERY host config, required (~4 min)
#   nix-checks    — builds the CI-safe check aggregate (includes the OCR app tree)
#
# The Python worker and the OCR app moved to github:Likivik/ocrflow and are
# tested in that repository's own CI; the local `python-tests` (pkgs/nc-ocr-flow)
# and `php-tests` (workflow-ocr PHP scripts) jobs went away with the cutover —
# they ran suites over code this repo no longer contains.
#
# The VM smoke deliberately does NOT run here. A hosted runner cannot cold-build
# the serenity closure: the build job was killed by its own 90-minute timeout
# with `nix` still running, while the same VM builds in 5-10 minutes on
# serenity, which already has the store. A job that cannot finish is worse than
# no job. Run the smoke locally instead — see AGENTS.md.
#
# This means CI proves every config EVALUATES, not that it BUILDS. A hash
# mismatch or a failing build step still gets through; the smoke is the only
# check covering that, and it is now a deliberate manual step.
#
# No caching here on purpose: with the heavy job gone there is nothing worth
# caching (the eval uses --dry-run and downloads nothing). A fleet-wide binary
# cache (attic on serenity) is the answer if the smoke ever comes back to CI —
# separate decision, currently paused.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  # Never cancel a run on main or in the merge queue: those results are what
  # actually gates the branch. Superseding an in-flight PR run is fine.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nix-eval:
    name: nix eval (all hosts)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate every nixosConfiguration
        run: |
          set -euo pipefail
          # ALL hosts are required on purpose: a change made for one host must
          # not silently break another. If a config stops evaluating, that is a
          # regression to fix, not a host to exclude.
          hosts=$(nix eval --raw .#nixosConfigurations \
            --apply 'cfgs: builtins.concatStringsSep " " (builtins.attrNames cfgs)')
          echo "hosts: $hosts"
          failed=""
          for h in $hosts; do
            echo "::group::eval $h"
            # No per-host cases: ocrflow checks its two secret files at
            # ACTIVATION time now (Likivik/ocrflow#27), so poweredge evaluates in
            # pure mode like every other host. The old workaround here forced the
            # two paths to /etc/hostname because the module asserted
            # builtins.pathExists at eval time, which no runner can satisfy.
            nix build --dry-run --no-link \
              ".#nixosConfigurations.$h.config.system.build.toplevel" \
              && echo "ok: $h" || {
                echo "::error::eval failed for $h"; failed="$failed $h"
              }
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "configs that do not evaluate:$failed"
            exit 1
          fi

  nix-checks:
    name: nix checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build the CI-safe check aggregate
        # ONE attr on purpose, so a new test suite joins CI by adding a line to
        # `checks.ci` in modules/defaults/checks.nix — no edit here, and no
        # ruleset edit, because this job's name is the required check and it
        # never changes.
        #
        # Deliberately NOT `nix build .#checks`: that set includes
        # serenity-smoke-vm plus the *-boot VM tests, none of which can finish
        # on a hosted runner. See the comment on checks.ci for why membership is
        # an explicit list rather than a name pattern.
        run: nix build -L .#checks.x86_64-linux.ci
