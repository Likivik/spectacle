# Hermes agent config — symlinked from this repo to the default
# config path on the vps. Edit here, commit, push, and the vps's
# systemd path unit restarts hermes-agent automatically.

# ── Model / provider ──────────────────────────────────────────────
model:
  base_url: "https://openrouter.ai/api/v1"
  default: "anthropic/claude-sonnet-4-6"

# ── Tools / behavior ──────────────────────────────────────────────
toolsets:
  - all
max_turns: 100
terminal:
  backend: local
  timeout: 180

# ── Memory / profile ──────────────────────────────────────────────
memory:
  memory_enabled: true
  user_profile_enabled: true

# ── Dashboard (Tailscale-only) ────────────────────────────────────
# Hermes dashboard binds to 0.0.0.0; the NixOS firewall restricts it
# to tailscale0. See modules/hosts/vps/vps.nix.
display:
  host: "0.0.0.0"
  port: 9119
