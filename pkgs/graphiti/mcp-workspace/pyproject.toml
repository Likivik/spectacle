[project]
name = "mcp-server"
version = "1.0.2"
description = "Graphiti MCP Server"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "mcp>=1.27.2,<2",
    "openai>=2.41.0",
    "graphiti-core[falkordb]==0.29.3",   # pinned: PR #1500 patch applied via uv2nix override
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "typing-extensions>=4.0.0",
    # falkordb 1.6.2 uses redis-py 5.1+ DriverInfo API
    "redis>=5.0,<6",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[tool.uv]
# Treat mcp-server as a virtual project — uv2nix loads only workspace.deps.*
# without trying to build mcp-server itself.
# See uv2nix issue #360 + PR #361.
package = false

# graphiti-core: PR #1500 patch only applies against the source tree
# (wheel .whl archives aren't extracted by Nix's unpackPhase).
# Force build from sdist.
no-binary-package = ["graphiti-core"]

# Packages with broken source builds — use wheels instead.
# falkordb 1.6.2 needs hatchling but doesn't declare it; wheels skip the
# broken build-system and use prebuilt binaries.
no-build-package = ["falkordb"]  # TODO: markupsafe needs setuptools override

# graphiti-core's sdist uses hatchling but doesn't declare it in
# pyproject.toml's [build-system].requires (upstream oversight).
# uv2nix supplies it via this extra-build-dependencies override.
[tool.uv.extra-build-dependencies]
graphiti-core = ["hatchling"]
markupsafe = ["setuptools"]
