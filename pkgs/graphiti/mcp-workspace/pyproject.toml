[project]
name = "mcp-server"
version = "1.0.2"
description = "Graphiti MCP Server"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "mcp>=1.27.2,<2",
    "openai>=2.41.0",
    "graphiti-core[falkordb]>=0.29.2",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "typing-extensions>=4.0.0",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"