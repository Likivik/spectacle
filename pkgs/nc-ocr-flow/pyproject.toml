[project]
name = "nc-ocr-flow"
version = "0.1.0"
description = "Nextcloud OCR pipeline: inotify watcher → ocrmypdf → VLM fallback"
requires-python = ">=3.12,<4"
dependencies = [
  # pyinotify 0.9.6 uses removed stdlib `asyncore` — incompatible with Py3.12+.
  # inotify_simple wraps inotify via ctypes, no compile step, works on Py3.13.
  "inotify-simple>=2.0.0",
  "pillow>=10.0",
  "requests>=2.31",
  "pytesseract>=0.3.10",
  "pikepdf>=8.0",
  "img2pdf>=0.5",
  "watchdog>=4.0",
  "numpy>=1.26",
  "onnxruntime>=1.17",
]

[project.scripts]
nc-ocr-flow = "nc_ocr_flow.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nc_ocr_flow"]

[tool.uv]
package = true

# uv2nix builds pkgs from source. Some packages (pyinotify) need setuptools
# as a build-system dependency that's not declared in their own pyproject.toml.
# See https://pyproject-nix.github.io/uv2nix/usage/extra-build-dependencies.html
[tool.uv.extra-build-dependencies]
pyinotify = ["setuptools"]
