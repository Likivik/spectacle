[project]
name = "nc-ocr-flow"
version = "0.2.0"
description = "Nextcloud OCR: tesseract-first hybrid with Surya VLM fallback, sandwich PDF"
requires-python = ">=3.12,<4"
dependencies = [
  "pymupdf>=1.24",
  "pillow>=10.0",
  "requests>=2.31",
  "img2pdf>=0.5",
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "fastapi>=0.100",
  "uvicorn>=0.20",
  "pydantic>=2.0",
]

[project.optional-dependencies]
server = [
  "surya-ocr>=0.13",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nc_ocr_flow"]

[tool.uv]
package = true
