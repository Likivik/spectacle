<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OCR Flow — Панель</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; font-family: system-ui, -apple-system, sans-serif;
    background: #14161a; color: #e2e4e9; font-size: 14px;
  }
  h1 { font-size: 1.2rem; margin: 0 0 .25rem; }
  .sub { color: #8b90a0; font-size: .85rem; margin-bottom: 1.25rem; }
  .auth { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .auth input[type=password] {
    background: #1e2128; color: #e2e4e9; border: 1px solid #2e323c; border-radius: 6px;
    padding: .45rem .7rem; font-size: .9rem; width: 22rem;
  }
  .auth button {
    background: #3563e9; border: none; color: #fff; border-radius: 6px;
    padding: .45rem 1rem; cursor: pointer; font-size: .9rem;
  }
  .auth button:hover { background: #2a52c9; }
  .stats { display: flex; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
  .stat {
    background: #1e2128; border: 1px solid #2e323c; border-radius: 8px;
    padding: .6rem 1rem; min-width: 7rem;
  }
  .stat b { display: block; font-size: 1.35rem; }
  .stat span { color: #8b90a0; font-size: .78rem; }
  table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #262a33; font-size: .85rem; }
  th { color: #8b90a0; font-weight: 600; font-size: .75rem; text-transform: uppercase; }
  td.path { max-width: 34rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: .1rem .55rem; border-radius: 10px; font-size: .72rem; font-weight: 600; }
  .badge.queued { background: #3a3413; color: #e8c832; }
  .badge.running { background: #123a5c; color: #4db2ff; }
  .badge.done { background: #123b24; color: #35d07f; }
  .badge.error { background: #47161a; color: #ff6b6b; }
  .badge.skipped { background: #2a2d36; color: #9aa0ae; }
  .rescan-row { display: flex; gap: .5rem; margin: 1.25rem 0; padding: 1rem; background: #1e2128; border-radius: 8px; border: 1px solid #2e323c; align-items: center; flex-wrap: wrap; }
  .rescan-row input[type=text] { flex: 1; min-width: 24rem; }
  .rescan-row input, select {
    background: #14161a; color: #e2e4e9; border: 1px solid #2e323c; border-radius: 6px;
    padding: .45rem .7rem; font-size: .88rem;
  }
  .rescan-row button {
    background: #3563e9; border: none; color: #fff; border-radius: 6px;
    padding: .5rem 1.2rem; cursor: pointer;
  }
  select { appearance: auto; }
  .empty { color: #8b90a0; padding: 1.5rem 0; text-align: center; }
  .flash { position: fixed; bottom: 1rem; right: 1rem; background: #123b24; color: #35d07f;
    padding: .7rem 1.2rem; border-radius: 8px; display: none; font-size: .88rem; }
  .flash.err { background: #47161a; color: #ff6b6b; }
  .err-msg { color: #ff6b6b; font-size: .78rem; }
  details.settings { margin: 1rem 0; background: #1e2128; border: 1px solid #2e323c;
    border-radius: 8px; padding: .6rem 1rem; }
  details.settings > summary { cursor: pointer; font-weight: 600; font-size: .95rem; }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem 1rem;
    margin-top: .8rem; align-items: center; }
  .settings-grid label { font-size: .85rem; }
  .settings-grid .src { color: #8b90a0; font-size: .75rem; }
  .settings-grid input[type=number] {
    background: #14161a; color: #e2e4e9; border: 1px solid #2e323c; border-radius: 6px;
    padding: .35rem .55rem; font-size: .88rem; width: 6rem;
  }
  .settings-grid .default-hint { color: #8b90a0; font-size: .72rem; }
  .settings-actions { margin-top: .8rem; display: flex; gap: .5rem; align-items: center; }
  .settings-actions button {
    background: #3563e9; border: none; color: #fff; border-radius: 6px;
    padding: .45rem 1.1rem; cursor: pointer; font-size: .88rem;
  }
  .settings-actions button:hover { background: #2a52c9; }
  .settings-actions button:disabled { background: #2e323c; cursor: not-allowed; }
  .settings-err { color: #ff6b6b; font-size: .82rem; margin-top: .5rem; }
  .settings-notice { color: #e8c832; background: #3a3413; border-radius: 6px;
    padding: .55rem .8rem; font-size: .85rem; margin-top: .6rem; }
  .load-line { color: #8b90a0; font-size: .85rem; margin: .5rem 0 .25rem; }
  .usage-line { font-size: .9rem; margin: .35rem 0; line-height: 1.45; }
  .usage-month { color: #8b90a0; font-size: .88rem; margin: .3rem 0 .6rem; }
  .usage-rate-ok   { color: #e2e4e9; }
  .usage-rate-warn { color: #e8c832; }
  .usage-rate-crit { color: #ff6b6b; }
  .usage-rate-fail { color: #ff6b6b; font-weight: 600; }
  .usage-rate-stale { color: #e8c832; }
</style>
</head>
<body>
  <h1>OCR Flow</h1>
  <div class="sub">nc-ocr-flow на poweredge — очередь OCR Nextcloud</div>

  <div class="auth">
    <input type="password" id="secret" placeholder="webhook secret" autocomplete="off">
    <button onclick="saveSecret()">Сохранить</button>
    <button onclick="refresh()">Обновить</button>
    <span id="conn" class="sub"></span>
  </div>

  <div class="rescan-row">
    <input type="text" id="rescanPath" placeholder="/likivik/files/Work/.../файл.pdf">
    <select id="engine">
      <option value="">по умолчанию (NC_OCR_ENGINE)</option>
      <option value="google">google — Cloud Vision</option>
      <option value="tesseract">tesseract — ocrmypdf</option>
      <option value="minimax">MiniMax-M3 — vision LLM</option>
    </select>
    <button onclick="rescan()">Пересканировать</button>
  </div>

  <div class="rescan-row" style="margin-top:.4rem">
    <input type="text" id="scanAllFolder" placeholder="папка, пусто = всё хранилище (Work/1-Аренда)">
    <button onclick="scanAll()">Сканировать всё (skip OCR-нутых)</button>
  </div>

  <details class="settings" id="settingsSection">
    <summary>Настройки</summary>
    <div class="settings-grid" id="settingsGrid"></div>
    <div class="settings-actions">
      <button id="settingsSaveBtn" onclick="saveSettings()" disabled>Сохранить</button>
      <button onclick="loadSettings()" style="background:#2e323c">Обновить</button>
      <span class="default-hint">значения из <code>env</code> перезапускаются вместе с сервисом</span>
    </div>
    <div id="settingsErr" class="settings-err" style="display:none"></div>
    <div id="settingsNotice" class="settings-notice" style="display:none"></div>
  </details>

  <details class="settings" id="usageSection">
    <summary>Расход и лимиты</summary>
    <div id="usageRate" class="usage-line">Google Vision: —</div>
    <div id="usageMonth" class="usage-month">За месяц: —</div>
    <table id="usageDays">
      <thead><tr><th>Дата</th><th>Движок</th><th>Задач</th><th>Страниц</th></tr></thead>
      <tbody></tbody>
    </table>
  </details>

  <div class="load-line" id="loadLine">очередь: —, в работе: —, воркеров: —</div>

  <div class="stats" id="stats"></div>

  <h1 style="font-size:1rem">Активные</h1>
  <table>
    <thead><tr><th>#</th><th>Статус</th><th>Файл</th><th>Движок</th><th>Начат</th></tr></thead>
    <tbody id="active"></tbody>
  </table>

  <h1 style="font-size:1rem; margin-top:1.5rem">История</h1>
  <table>
    <thead><tr><th>#</th><th>Статус</th><th>Файл</th><th>Движок</th><th>Время</th></tr></thead>
    <tbody id="history"></tbody>
  </table>

  <div class="flash" id="flash"></div>

<script>
const SKEY = 'ocrflow_secret';
const secret = () => localStorage.getItem(SKEY) || '';
const $ = (id) => document.getElementById(id);

$('secret').value = secret();
if (secret()) { refresh(); loadSettings(); }
setInterval(() => { if (secret()) refresh(); }, 5000);

function saveSecret() {
  localStorage.setItem(SKEY, $('secret').value.trim());
  refresh();
  loadSettings();
}

function flash(msg, err=false) {
  const f = $('flash');
  f.textContent = msg;
  f.className = 'flash' + (err ? ' err' : '');
  f.style.display = 'block';
  setTimeout(() => f.style.display = 'none', 3500);
}

async function api(path, opts={}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'X-Webhook-Secret': secret(), 'Content-Type': 'application/json', ...(opts.headers||{}) },
  });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.detail || r.statusText);
  }
  return r.json();
}

async function refresh() {
  try {
    const d = await api('/status?limit=100');
    $('conn').textContent = '✓ подключено';
    renderStats(d);
    renderLoad(d);
    renderActive(d);
    renderHistory(d);
  } catch (e) {
    $('conn').textContent = '✗ ' + e.message;
  }
  // /stats is best-effort: a 404 / 500 must not blank the rest of the panel.
  try {
    const s = await api('/stats');
    renderUsage(s);
  } catch (e) {
    renderUsage(null);
  }
}

function renderLoad(d) {
  const q = (d.queue_depth ?? '—');
  const r = (d.running && d.running.length != null) ? d.running.length : (d.running ?? '—');
  const w = (d.workers ?? '—');
  $('loadLine').textContent = `очередь: ${q}, в работе: ${r}, воркеров: ${w}`;
}

function renderStats(d) {
  const hist = d.history || [];
  const done = hist.filter(j => j.status === 'done').length;
  const errs = hist.filter(j => j.status === 'error').length;
  const skip = hist.filter(j => j.status === 'skipped').length;
  $('stats').innerHTML = `
    <div class="stat"><b>${d.queue_depth}</b><span>в очереди</span></div>
    <div class="stat"><b>${(d.running||[]).length}</b><span>выполняется</span></div>
    <div class="stat"><b>${done}</b><span>готово</span></div>
    <div class="stat"><b>${errs}</b><span>ошибок</span></div>
    <div class="stat"><b>${skip}</b><span>пропущено</span></div>`;
}

function dur(j) {
  const t0 = j.started || j.created;
  const t1 = j.finished || Date.now() / 1000;
  const s = Math.round(t1 - t0);
  return s < 60 ? `${s}с` : `${Math.floor(s / 60)}м${s % 60}с`;
}

function timeStr(ts) {
  if (!ts) return '—';
  return new Date(ts * 1000).toLocaleTimeString('ru-RU');
}

function esc(s) {
  // Escape HTML metacharacters — all interpolated values (file paths, error
  // messages) originate from the OCR queue and may contain user-controlled
  // Nextcloud file names.
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderActive(d) {
  const act = [...(d.running||[]), ...(d.queued||[])];
  $('active').innerHTML = act.length ? act.map(j => `
    <tr>
      <td>${j.id}</td>
      <td><span class="badge ${esc(j.status)}">${esc(j.status)}</span></td>
      <td class="path" title="${esc(j.path)}">${esc(j.path)}</td>
      <td>${esc(j.engine)}</td>
      <td>${j.status === 'running' ? dur(j) : '—'}</td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty">очередь пуста</td></tr>';
}

function renderHistory(d) {
  const h = d.history || [];
  $('history').innerHTML = h.length ? h.map(j => `
    <tr>
      <td>${j.id}</td>
      <td><span class="badge ${esc(j.status)}">${esc(j.status)}</span>${j.error ? `<div class="err-msg">${esc(j.error.slice(0,120))}</div>` : ''}</td>
      <td class="path" title="${esc(j.path)}">${esc(j.path)}</td>
      <td>${esc(j.engine)}</td>
      <td>${timeStr(j.finished)}</td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty">нет истории</td></tr>';
  // NOTE: innerHTML is used with esc() applied to every interpolated dynamic
  // value (path, status, engine, error) — safe against XSS from filenames.
}

function fmtNum(n) {
  return Number.isFinite(n) ? n.toLocaleString('ru-RU') : '—';
}

function fmtUsd(n) {
  return Number.isFinite(n) ? n.toFixed(4) : '—';
}

function fmtRelAgo(unixSec) {
  const s = Math.round(Date.now() / 1000 - Number(unixSec));
  if (!Number.isFinite(s) || s < 0) return 'только что';
  if (s < 60)        return `${s}с`;
  if (s < 3600)      return `${Math.floor(s / 60)}м`;
  if (s < 86400)     return `${Math.floor(s / 3600)}ч${Math.floor((s % 3600) / 60)}м`;
  return `${Math.floor(s / 86400)}д`;
}

function renderUsage(d) {
  const rateEl  = $('usageRate');
  const monthEl = $('usageMonth');
  const tbEl    = $('usageDays').querySelector('tbody');
  const v = (d && d.vision) || {};
  const usage = (d && Array.isArray(d.usage)) ? d.usage : [];

  // ---- rate line ----
  if (v.quota_ok === false) {
    rateEl.className = 'usage-line usage-rate-fail';
    rateEl.textContent = 'Google Vision: квота не читается';
  } else {
    const used   = v.used_per_min;
    const limit  = v.limit_per_min;
    const pct    = v.used_percent;
    const ageSec = (v.quota_checked != null)
      ? Math.round(Date.now() / 1000 - Number(v.quota_checked))
      : null;
    const stale  = ageSec != null && ageSec > 3600;
    const warn   = Number.isFinite(pct) && pct >= 95;
    const yellow = Number.isFinite(pct) && pct >= 80 && !warn;

    const cls = warn ? 'usage-rate-crit'
              : yellow ? 'usage-rate-warn'
              : stale ? 'usage-rate-stale'
              : 'usage-rate-ok';
    rateEl.className = 'usage-line ' + cls;

    let txt = 'Google Vision: ';
    txt += (Number.isFinite(used) && Number.isFinite(limit))
      ? `${fmtNum(used)} из ${fmtNum(limit)} запросов/мин (${Number.isFinite(pct) ? pct.toFixed(1) : '—'}%)`
      : '—';
    if (ageSec != null) {
      txt += ` · проверено ${fmtRelAgo(v.quota_checked)} назад`;
    }
    rateEl.textContent = txt;
  }

  // ---- monthly line ----
  const pages  = v.pages_month;
  const cost   = v.cost_usd;
  const free   = v.free_left;
  const total  = v.free_units;
  monthEl.className = 'usage-month';
  monthEl.textContent = (Number.isFinite(pages) || Number.isFinite(cost) || Number.isFinite(free))
    ? `За месяц: ${fmtNum(pages)} страниц · ~$${fmtUsd(cost)} · бесплатных осталось ${fmtNum(free)} из ${fmtNum(total)}`
    : 'За месяц: —';

  // ---- 7-day table ----
  if (!usage.length) {
    tbEl.innerHTML = '<tr><td colspan="4" class="empty">нет данных</td></tr>';
    return;
  }
  tbEl.innerHTML = usage.slice(0, 7).map(u => `
    <tr>
      <td>${esc(u.day)}</td>
      <td>${esc(u.engine)}</td>
      <td>${fmtNum(u.jobs)}</td>
      <td>${fmtNum(u.pages)}</td>
    </tr>`).join('');
}

const SETTINGS_KEYS = ['workers', 'max_concurrent_google', 'max_concurrent_tesseract', 'max_concurrent_minimax'];
let currentSettings = null;     // last /settings response (server-authoritative)
let currentDefaults = null;     // last defaults from /settings
let currentSources  = null;     // last sources from /settings

async function loadSettings() {
  const errEl = $('settingsErr');
  errEl.style.display = 'none';
  if (!secret()) return;
  try {
    const d = await api('/settings');
    currentSettings = d.settings || {};
    currentDefaults = d.defaults || {};
    currentSources  = d.sources  || {};
    renderSettings();
  } catch (e) {
    errEl.textContent = 'Не удалось загрузить настройки: ' + e.message;
    errEl.style.display = 'block';
  }
}

function renderSettings() {
  if (!currentSettings) return;
  $('settingsNotice').style.display = 'none';
  const rows = SETTINGS_KEYS.map(k => {
    const v = currentSettings[k];
    const def = currentDefaults[k];
    const src = currentSources[k] || 'default';
    return `
      <label for="set_${k}">${k}</label>
      <div>
        <input type="number" id="set_${k}" data-key="${esc(k)}" min="0" step="1" value="${esc(v)}">
        <span class="default-hint">по умолчанию ${esc(def)}</span>
        <span class="src">· ${esc(srcLabel(src))}</span>
      </div>`;
  }).join('');
  $('settingsGrid').innerHTML = rows;
  SETTINGS_KEYS.forEach(k => {
    const el = $('set_' + k);
    el.addEventListener('input', onSettingsChange);
  });
  $('settingsSaveBtn').disabled = true;
}

function srcLabel(s) {
  if (s === 'env') return 'значение: env (перезапуск)';
  if (s === 'db') return 'значение: db';
  return 'значение: default';
}

function onSettingsChange() {
  $('settingsSaveBtn').disabled = !hasDirtySettings();
}

function hasDirtySettings() {
  if (!currentSettings) return false;
  return SETTINGS_KEYS.some(k => {
    const el = $('set_' + k);
    if (!el) return false;
    const v = Number(el.value);
    return Number.isFinite(v) && v !== Number(currentSettings[k]);
  });
}

function dirtySettingsPayload() {
  if (!currentSettings) return {};
  const out = {};
  SETTINGS_KEYS.forEach(k => {
    const el = $('set_' + k);
    if (!el) return;
    const v = Number(el.value);
    if (Number.isFinite(v) && v !== Number(currentSettings[k])) out[k] = v;
  });
  return out;
}

async function saveSettings() {
  const errEl = $('settingsErr');
  const noticeEl = $('settingsNotice');
  errEl.style.display = 'none';
  noticeEl.style.display = 'none';
  const payload = dirtySettingsPayload();
  if (!Object.keys(payload).length) return;
  const btn = $('settingsSaveBtn');
  btn.disabled = true; btn.textContent = 'Сохраняю…';
  try {
    const d = await api('/settings', { method: 'POST', body: JSON.stringify(payload) });
    currentSettings = d.settings || currentSettings;
    currentSources  = d.sources  || currentSources;
    renderSettings();
    if (d.restart_required) {
      noticeEl.textContent = 'Чтобы применить число воркеров, нужен перезапуск сервиса nc-ocr-webhook. Незавершённые задачи не потеряются — они вернутся в очередь.';
      noticeEl.style.display = 'block';
    }
    flash(`сохранено: ${(d.saved || []).join(', ') || 'без изменений'}`);
    refresh();
  } catch (e) {
    errEl.textContent = 'Не удалось сохранить: ' + e.message;
    errEl.style.display = 'block';
    btn.disabled = false;
  } finally {
    btn.textContent = 'Сохранить';
  }
}

async function rescan() {
  const p = $('rescanPath').value.trim();
  if (!p) return flash('укажи путь файла', true);
  const eng = $('engine').value;
  const body = { path: p };
  if (eng) body.engine = eng;  // empty → server resolves from NC_OCR_ENGINE
  try {
    const d = await api('/rescan', { method: 'POST', body: JSON.stringify(body) });
    flash(`задание #${d.job_id} поставлено в очередь (${d.engine})`);
    $('rescanPath').value = '';
    refresh();
  } catch (e) {
    flash(e.message, true);
  }
}

async function scanAll() {
  const folder = $('scanAllFolder').value.trim();
  const label = folder || 'всё хранилище';
  if (!confirm(`Поставить в очередь все PDF/картинки из «${label}»?\nУже OCR-нутые будут пропущены.`)) return;
  try {
    const d = await api('/scan-all', { method: 'POST', body: JSON.stringify({ folder, skip_ocrd: true }) });
    flash(`в очередь: ${d.enqueued}, пропущено уже OCR-нутых: ${d.skipped_ocrd}`);
    refresh();
  } catch (e) {
    flash(e.message, true);
  }
}
</script>
</body>
</html>
