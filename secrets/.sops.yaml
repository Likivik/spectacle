# sops encryption config
#
# Add keys here as they're generated. Each machine's TPM identity
# is unique — generate on that machine using:
#   age-plugin-tpm --generate -o ~/.config/sops/tpm-identity.txt
# Then get the recipient:
#   For legacy tpm-format identities: extract from file's "# Recipient:" header
#   For p256tag-format identities:   age-plugin-tpm -y <identity-file>
#
# The recovery key is a standard age keypair kept in Bitwarden:
#   age-keygen -o ~/likivik-nixos-sops-recovery-key.txt
# Then encrypt the file with a strong password and store in Bitwarden.
#
keys:
  - &recovery    age1p92sy8mdsct6043lt8pxfdwszaeru6tyg93qc89wskgv69uy9ypsekt0uv
  - &serenity    age1tpm1qv0knc0cp5lpl50f6yfxm86qzsupxa0hsjnync68frjl29jvhehzxfseltc
  - &traversal   age1tpm1qvkntwdflesh4dcam49jr9c7ef77c452kv6c3v5a6dfwvcwthh68j8e6hc8
  - &erebus      age1ccyqmazc38zfc2ff9sh9j7f9j64acncr09g6rry4l5cnkn96ng4s0vaudu
  - &poweredge   age1zmy54y2ldzk7glgyd6dc2q6ta2glv97ph92640xz0ckwc076q9pq7220au

creation_rules:
  - path_regex: erebus/.*\.yaml$
    key_groups:
      - age:
          - *recovery
          - *serenity
          - *traversal
          - *erebus


  - path_regex: poweredge/.*\.yaml$
    key_groups:
      - age:
          - *recovery
          - *serenity
          - *traversal
          - *erebus
          - *poweredge

  - path_regex: traversal/.*\.yaml$
    key_groups:
      - age:
          - *recovery
          - *serenity
          - *traversal
          - *erebus
