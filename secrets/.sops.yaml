# sops encryption config for vps secrets.
#
# Keys:
#   &user_age  — generated by user on their local machine:
#                  age-keygen -o ~/.config/sops/age/keys.txt
#                then get the public key:
#                  age-keygen -y ~/.config/sops/age/keys.txt
#                Add the .pub result as a single-line string here.
#   &vps_age   — generated on the vps after first NixOS install:
#                  ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
#                Add the output line here.
#
# To edit: sops secrets/vps/secrets.yaml
# To re-encrypt after adding a key: sops --rotate --in-place secrets/vps/secrets.yaml

keys:
  - &user_age ~/.config/sops/age/keys.txt.pub
  - &vps_age  secrets/vps/age.pub

creation_rules:
  - path_regex: secrets/vps/.*\.yaml$
    key_groups:
      - age:
          - *user_age
          - *vps_age
